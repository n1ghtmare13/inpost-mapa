name: Deploy & Update InPost Map

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "0*.py"

      - name: Run pipeline updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          uv run 01_fetch_nog.py
          uv run 02_fetch_lockers.py
          uv run 03_process_zones.py
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data_raw/nog_current.csv data_raw/lockers_raw.json
          git add -A data_raw/nog_upcoming.csv 2>/dev/null || true
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated inpost zones & lockers sync"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4